name: Build, Test, and Package

on: [push, pull_request]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: amd64
          - os: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            ccache \
            cmake \
            dpkg-dev \
            file \
            libasound2-dev \
            libbson-dev \
            libcurl4-openssl-dev \
            libmp3lame-dev \
            libprotobuf-dev \
            libpthreadpool-dev \
            libsasl2-dev \
            libssl-dev \
            libsystemd-dev \
            libutf8proc-dev \
            libuv1-dev \
            ninja-build \
            pkgconf \
            protobuf-compiler \
            util-linux \
            uuid-dev

      - name: Cache compiled dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            externals/build
            externals/install
            ~/.cache/ccache
          key: linux-deps-${{ matrix.architecture }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'externals/**/CMakeLists.txt', 'build_oatpp.sh') }}

      - name: Build oatpp
        run: ./build_oatpp.sh

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ./run_linux_tests.sh build

      - name: Create Debian package with CPack
        run: cpack --config build/CPackConfig.cmake -G DEB -B package

      - name: Inspect package metadata
        run: dpkg-deb --info package/*.deb

      - name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: creature-server-package-${{ matrix.architecture }}
          path: package/*.deb
          # 7-day retention so build artifacts don't pile up against the
          # account-level Actions storage quota. Long enough to grab a
          # package off a recent commit; older commits should be rebuilt.
          retention-days: 7
